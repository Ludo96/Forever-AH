<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auction ledger</title>
<meta name="description" content="Price history and deals for the WoW Forever auction house.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310222a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e3b341'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='none' stroke='%2310222a' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/alegreya-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<header class="top">
  <div class="top-title">
    <h1>Auction ledger</h1>
    <p id="status" class="status">Loading prices…</p>
    <p class="refresh-row">
      <button id="refresh" class="quiet" type="button">Refresh</button>
      <span id="refresh-note" class="dim" role="status"></span>
    </p>
  </div>
  <div id="houses" class="seg" role="group" aria-label="Auction house"></div>
</header>

<p id="notice" class="notice" hidden></p>

<nav class="bar" aria-label="Views">
  <div id="tabs" class="tabs"></div>
  <label class="search">
    <span class="sr">Find an item</span>
    <input id="q" type="search" placeholder="Find an item" autocomplete="off" spellcheck="false">
  </label>
</nav>

<main id="layout" class="layout">
  <section class="list">
    <div class="list-head">
      <p id="blurb" class="blurb"></p>
      <div id="controls" class="controls"></div>
    </div>
    <div class="tablewrap">
      <table id="table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden></div>
    <button id="more" class="quiet more" type="button" hidden>Show more items</button>
  </section>

  <aside id="detail" class="detail" aria-label="Item details" hidden></aside>
</main>

<footer class="foot">
  <p>Prices come from current listings, not completed sales, so treat every figure as an asking price. Blizzard refreshes its data about once an hour; this page checks every 20 minutes.</p>
  <p id="footnote"></p>
</footer>

<script src="vendor/uPlot.iife.min.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>
